server {
    listen 80;
    listen [::]:80;
    server_name _;

    access_log /var/log/nginx/index_access.log;
    error_log  /var/log/nginx/index_error.log warn;

    root /usr/share/nginx/html;
    index astr.html;

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        root /usr/share/nginx/html;
    }
}
server {
    listen 7824;
    listen [::]:7824;
    server_name _;

    access_log /var/log/nginx/astrbot_access.log;
    error_log  /var/log/nginx/astrbot_error.log warn;

    location / {
        proxy_pass http://astrbot:6185/;

        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "";

        proxy_buffering off;
        proxy_redirect  off;
    }
}
